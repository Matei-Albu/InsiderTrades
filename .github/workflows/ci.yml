name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingester:
    name: Go ingester
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingester
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ingester/go.mod
          cache-dependency-path: ingester/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  web:
    name: Next.js app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Placeholders: all pages are dynamic, so no data is fetched at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
