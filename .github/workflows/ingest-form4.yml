name: Ingest Form 4

on:
  schedule:
    # Every 15 min during EDGAR acceptance hours (~6am-10pm ET).
    # Cron is UTC; this covers both EDT and EST with a little slack.
    - cron: "*/15 10-23 * * 1-5"
    - cron: "*/15 0-3 * * 2-6"
  workflow_dispatch:

concurrency:
  group: ingest-form4
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ingester
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ingester/go.mod
          cache-dependency-path: ingester/go.sum
      - name: Ingest new Form 4 filings
        run: go run ./cmd/ingester form4
      - name: Send watchlist alerts
        if: ${{ secrets.RESEND_API_KEY != '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
        run: go run ./cmd/ingester alerts
