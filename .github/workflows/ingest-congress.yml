name: Ingest Congress

on:
  schedule:
    # Twice daily — House PTR indexes update irregularly.
    - cron: "0 14,22 * * *"
  workflow_dispatch:

concurrency:
  group: ingest-congress
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ingester
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is missing or empty"
            missing=1
          fi
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT repository secret is missing or empty"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add them under Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi
          echo "Required secrets are set"
      - uses: actions/setup-go@v5
        with:
          go-version-file: ingester/go.mod
          cache-dependency-path: ingester/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser deps
        run: pip install -r scripts/requirements.txt
      - name: Ingest House STOCK Act PTRs
        run: go run ./cmd/ingester congress
